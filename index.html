<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP SPORTS LIVE v14.0</title>
    <style>
        :root { --nba: #17408b; --nhl: #000000; --hip: #15803d; --bg: #f3f4f6; }
        body { margin: 0; background: var(--bg); color: #1f2937; font-family: -apple-system, sans-serif; padding-bottom: 20px; }
        
        /* Header Estilo ESPN */
        header { background: #cc0000; color: white; padding: 15px; text-align: center; font-weight: 900; font-size: 1.2rem; letter-spacing: 1px; }
        
        /* Visitas */
        .v-bar { background: #e5e7eb; text-align: center; padding: 5px; font-size: 0.7rem; color: #6b7280; font-weight: bold; }

        /* Tabs de Navegación */
        .nav { display: flex; background: #fff; sticky: top; top: 0; z-index: 100; border-bottom: 1px solid #e5e7eb; overflow-x: auto; }
        .nav-item { flex: 1; min-width: 100px; padding: 15px 0; text-align: center; font-size: 0.8rem; font-weight: 800; color: #9ca3af; cursor: pointer; border-bottom: 3px solid transparent; }
        .nav-item.active { color: #cc0000; border-bottom-color: #cc0000; }

        /* Contenedor de Juegos */
        .section { display: none; padding: 12px; }
        .section.active { display: block; }

        /* Tarjeta de Juego Estilo Marcador */
        .game { background: #fff; border-radius: 8px; margin-bottom: 10px; border: 1px solid #e5e7eb; overflow: hidden; }
        .game-header { background: #f9fafb; padding: 8px 12px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 0.65rem; font-weight: bold; color: #059669; text-transform: uppercase; }
        .date { font-size: 0.65rem; color: #9ca3af; }
        
        .game-body { padding: 15px 12px; text-align: center; }
        .teams { font-size: 1rem; font-weight: 700; color: #111827; margin-bottom: 15px; }

        /* Botones de Links */
        .actions { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border-radius: 6px; text-decoration: none; font-size: 0.7rem; font-weight: bold; text-align: center; }
        .btn-1 { background: #111827; color: #fff; }
        .btn-2 { background: #f3f4f6; color: #1f2937; border: 1px solid #e5e7eb; }
    </style>
</head>
<body>

<div id="app-ui">
    <header>VIP SPORTS HUB</header>
    <div class="v-bar">VISITAS AL SISTEMA: <span id="v-num">0</span></div>

    <div class="nav">
        <div class="nav-item active" onclick="App.tab('nba', this)">NBA</div>
        <div class="nav-item" onclick="App.tab('nhl', this)">NHL</div>
        <div class="nav-item" onclick="App.tab('hip', this)">HIPISMO</div>
    </div>

    <main>
        <div id="nba" class="section active"></div>
        <div id="nhl" class="section"></div>
        <div id="hip" class="section"></div>
    </main>
</div>

<script>

    const _render = () => {
        Object.keys(_D).forEach(k => {

            container.innerHTML = _D[k].map(g => `
                <div class="game">
                    <div class="game-header">
                        <span class="status">● En Vivo</span>
                        <span class="date">HOY</span>
                    </div>
                    <div class="game-body">
                        <div class="teams">${g.t}</div>
                        <div class="actions">
                            <a href="javascript:void(0)" onclick="App.go('${g.u1}')" class="btn btn-1">OPCIÓN 1</a>
                            <a href="javascript:void(0)" onclick="App.go('${g.u2}')" class="btn btn-2">OPCIÓN 2</a>
                        </div>
                    </div>
                </div>
            `).join('');
        });
    };

    return {
        init: () => {
            _render();
            let v = localStorage.getItem('v_v13') || 0;
            v++; 
            localStorage.setItem('v_v13', v);
            document.getElementById('v-num').innerText = v;
        },
        go: (u) => { window.open(atob(u), '_blank'); },
        tab: (id, el) => {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(id).classList.add('active');
        }
    };
})();
document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
